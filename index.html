<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <form class="pokeForm">
        <input type="text" class="pokeInput" placeholder="Enter Pokemon!">
        <button type="submit" class="pokeButton">Show</button>
    </form>
    <div class="container">
        <div class="card">
            <img id="pokemon-img" alt="Pokemon image">
            <h1 id="name"></h1>
            <p id="abilityName"></p> 
            <p id="abilityDesc"></p>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
